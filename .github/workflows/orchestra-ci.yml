name: Orchestra Quality Gates CI

on:
  push:
    branches: [ main, dev, main-test ]
  pull_request:
    branches: [ main, dev, main-test ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Node.js (Conditionally used for JS Stack validators)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Conductor Dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Run Orchestra Workspace Doctor
      run: |
        python .orchestra/.conductor/tools/cli_doctor.py

    - name: Run Orchestra Pre-flight Suite Check
      run: |
        python .orchestra/.conductor/tools/cli_test_suite.py --dry-run
