name: Continuous Integration

on:
  push:
    branches: [ main, dev, main-test ]
  pull_request:
    branches: [ main, dev, main-test ]

jobs:
  backend-php:
    name: PHP Syntax & Backend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, sqlite3, json, curl, mbstring

      - name: Lint PHP Syntax
        run: |
          echo "Scanning all PHP files for syntax errors..."
          find mass_utility mass_utility_admin mass_utility_dashboard -name "*.php" -exec php -l {} +

  frontend-admin:
    name: Admin Frontend (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mass_utility_admin/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: mass_utility_admin/frontend
        run: npm ci

      - name: Compile TypeScript & Build Production Bundle
        working-directory: mass_utility_admin/frontend
        run: npm run build

  frontend-dashboard:
    name: Dashboard Frontend (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mass_utility_dashboard/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: mass_utility_dashboard/frontend
        run: npm ci

      - name: Compile TypeScript & Build Production Bundle
        working-directory: mass_utility_dashboard/frontend
        run: npm run build
